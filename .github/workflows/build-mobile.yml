name: Build mobile apps

on:
  push:
    branches: [master]
    paths:
      - 'three-floor-chess.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Prepare web assets
        working-directory: mobile
        run: npm run prepare-www

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: three-floor-chess-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Prepare web assets
        working-directory: mobile
        run: npm run prepare-www

      - name: Generate iOS project
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build for simulator (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: three-floor-chess-ios-simulator
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
